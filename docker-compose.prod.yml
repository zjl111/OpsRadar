services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${OPSRADAR_V1_DB:-opsradar_v1}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${OPSRADAR_V1_DB:-opsradar_v1}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  opsradar-api:
    restart: unless-stopped
    environment:
      OPSRADAR_ENV: production
      OPSRADAR_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${OPSRADAR_V1_DB:-opsradar_v1}?sslmode=disable
      OPSRADAR_REDIS_ADDR: redis:6379
      OPSRADAR_REDIS_DB: ${OPSRADAR_V1_REDIS_DB:-2}
      OPSRADAR_JWT_SECRET: ${OPSRADAR_JWT_SECRET:?OPSRADAR_JWT_SECRET is required}
      OPSRADAR_ENCRYPTION_KEY: ${OPSRADAR_ENCRYPTION_KEY:?OPSRADAR_ENCRYPTION_KEY is required}
      OPSRADAR_ADMIN_USERNAME: ${OPSRADAR_ADMIN_USERNAME:-admin}
      OPSRADAR_ADMIN_PASSWORD: ${OPSRADAR_ADMIN_PASSWORD:?OPSRADAR_ADMIN_PASSWORD is required}
      OPSRADAR_WORKER_TOKEN: ${OPSRADAR_WORKER_TOKEN:?OPSRADAR_WORKER_TOKEN is required}
      OPSRADAR_REPORT_DIR: /app/reports
    volumes:
      - reports_v1_data:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  opsradar-worker-agent:
    restart: unless-stopped
    environment:
      OPSRADAR_ENV: production
      OPSRADAR_WORKER_TOKEN: ${OPSRADAR_WORKER_TOKEN:?OPSRADAR_WORKER_TOKEN is required}

  opsradar-web:
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${OPSRADAR_TLS_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    depends_on:
      opsradar-api:
        condition: service_healthy
      opsradar-web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  reports_v1_data:
